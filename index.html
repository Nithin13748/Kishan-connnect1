<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kisan Connect</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f2;--card:#fff;--ink:#1c1c1c;--mute:#6b6b6b;--line:#e6e6e0;--y:#f8cb46;--g:#0c831f;--gl:#eaf6ec;--r:14px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--card:#1d1d1d;--ink:#f1f1f1;--mute:#a5a5a5;--line:#303030;--gl:#12301a}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 'Plus Jakarta Sans','Noto Sans Kannada',system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.wrap{max-width:960px;margin:0 auto;padding:0 14px 110px}
header{background:var(--y);color:#1c1c1c;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header .in{max-width:960px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}.logo b{color:var(--g)}
.sp{flex:1}
.pill{border:1px solid #1c1c1c33;background:#fff8;border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px;color:#1c1c1c}
.center{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:30px 0}
h1{font-size:30px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.5px}
h2{font-size:18px;margin:18px 0 10px}
.mute{color:var(--mute)}
.opts{display:grid;gap:12px;width:100%;max-width:420px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px;text-align:left;display:flex;gap:14px;align-items:center;font-weight:700;font-size:17px}
.opt:hover{border-color:var(--g)}
.opt .e{font-size:34px}.opt small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:11px 18px;font-weight:700}
.btn.o{background:var(--gl);color:var(--g);border:1px solid var(--g)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-weight:600}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-top:12px}
.hero{background:linear-gradient(100deg,#0c831f,#2fa24a);color:#fff;border-radius:var(--r);padding:18px;margin-top:12px;display:flex;justify-content:space-between;align-items:center}
.hero b{font-size:20px;display:block}.hero span{font-size:44px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.p{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:4px}
.p .img{background:var(--gl);border-radius:10px;height:92px;display:flex;align-items:center;justify-content:center;font-size:48px}
.tag{font-size:11px;background:var(--bg);border-radius:6px;padding:2px 6px;align-self:flex-start;color:var(--mute)}
.p .n{font-weight:700}.p .f{font-size:12px;color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:6px;padding-top:6px}
.add{border:1px solid var(--g);color:var(--g);background:var(--gl);border-radius:8px;padding:6px 16px;font-weight:800}
.step{display:flex;align-items:center;background:var(--g);color:#fff;border-radius:8px;overflow:hidden}
.step button{background:none;border:0;color:#fff;padding:6px 10px;font-weight:800}
.step span{min-width:18px;text-align:center;font-weight:700}
.cartbar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
.cartbar button{display:flex;width:100%;max-width:560px;margin:0 auto;justify-content:space-between;background:var(--g);color:#fff;border:0;border-radius:14px;padding:14px 18px;font-weight:800;box-shadow:0 6px 20px #0004}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
label{font-size:12px;color:var(--mute);display:block;margin-bottom:3px}
input,select{width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--bg)}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border:0}
.x{background:none;border:0;color:#d33;font-weight:700}
.modal{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#1c1c1c;color:#fff;padding:12px 16px;border-radius:12px;z-index:30;max-width:92%;box-shadow:0 6px 20px #0006}
.badge{background:#d33;color:#fff;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:700}
.note{font-size:12px;color:var(--mute);margin-top:14px}
</style>
</head>
<body>
<header><div class="in"><div class="logo">Kisan<b>Connect</b></div><div class="sp"></div><span id="hbtns"></span></div></header>
<div class="wrap" id="app"></div>
<div id="db-status" style="text-align:center;font-size:12px;color:#68736a;padding:8px 12px">Connecting to Firebase…</div>
<div id="layer"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDds4_DDc_nlMVq-gSI3abTOLJAYGBG3II",
  authDomain: "kisanconnect-bfadf.firebaseapp.com",
  databaseURL: "https://kisanconnect-bfadf-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kisanconnect-bfadf",
  storageBucket: "kisanconnect-bfadf.firebasestorage.app",
  messagingSenderId: "445749577119",
  appId: "1:445749577119:web:733677b5ebb8acd650e9aa",
  measurementId: "G-031M07FW9J"
};
// ==========================================
// KISAN CONNECT - FIREBASE CONFIGURATION
// ==========================================

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

const productsRef = db.ref("kisanConnect/products");
const ordersRef = db.ref("kisanConnect/orders");

let currentUser = null;
let authReady = false;
let firebaseReady = false;

// Central Firebase data
let productsCache = [];
let ordersCache = [];

// ==========================================
// LOCAL USER SETTINGS
// ==========================================

const L = key => {
    if (key === "kc_products") return productsCache;
    if (key === "kc_orders") return ordersCache;

    try {
        return JSON.parse(localStorage.getItem(key)) || [];
    } catch {
        return [];
    }
};

// ==========================================
// FIREBASE DATABASE STATUS
// ==========================================

function setDbStatus(message) {
    const el = document.getElementById("db-status");

    if (el) {
        el.textContent = message;
    }
}

// ==========================================
// SAVE DATA TO FIREBASE
// ==========================================

async function W(key, value) {

    if (!currentUser) {
        throw new Error("Please sign in first.");
    }

    const ref = key === "kc_products"
        ? productsRef
        : ordersRef;

    try {

        await ref.set(value);

        if (key === "kc_products") {
            productsCache = value;
        } else {
            ordersCache = value;
        }

        localStorage.setItem(key, JSON.stringify(value));

        firebaseReady = true;

        setDbStatus("Connected to Firebase ✓");

        return true;

    } catch (error) {

        console.error("Firebase save error:", error);

        setDbStatus("Firebase save failed");

        toast("Unable to save data: " + error.message);

        throw error;
    }
}

// ==========================================
// LOAD AND SYNCHRONIZE FIREBASE DATA
// ==========================================

async function loadFirebaseData() {

    try {

        setDbStatus("Loading Firebase data...");

        // Load products
        const productSnapshot = await productsRef.once("value");

        const productData = productSnapshot.val();

        if (productData !== null) {

            productsCache = Array.isArray(productData)
                ? productData
                : Object.values(productData);

        } else {

            productsCache = [];
        }

        // Load orders
        const orderSnapshot = await ordersRef.once("value");

        const orderData = orderSnapshot.val();

        if (orderData !== null) {

            ordersCache = Array.isArray(orderData)
                ? orderData
                : Object.values(orderData);

        } else {

            ordersCache = [];
        }

        localStorage.setItem(
            "kc_products",
            JSON.stringify(productsCache)
        );

        localStorage.setItem(
            "kc_orders",
            JSON.stringify(ordersCache)
        );

        firebaseReady = true;

        setDbStatus("Connected to Firebase ✓");

        // Start real-time synchronization
        startRealtimeSync();

    } catch (error) {

        console.error("Firebase loading error:", error);

        firebaseReady = false;

        setDbStatus("Firebase connection failed");

        toast("Database connection failed");
    }
}

// ==========================================
// REAL-TIME SYNCHRONIZATION
// ==========================================

function startRealtimeSync() {

    // Listen for product changes
    productsRef.on("value", snapshot => {

        const data = snapshot.val();

        productsCache = data
            ? (Array.isArray(data) ? data : Object.values(data))
            : [];

        localStorage.setItem(
            "kc_products",
            JSON.stringify(productsCache)
        );

        firebaseReady = true;

        setDbStatus("Connected · Live synchronization ✓");

        if (S.role === "consumer") {
            grid();
        }

        if (S.role === "farmer") {
            farmer();
        }

    }, error => {

        console.error("Product listener error:", error);

    });


    // Listen for new orders
    ordersRef.on("value", snapshot => {

        const data = snapshot.val();

        const updatedOrders = data
            ? (Array.isArray(data) ? data : Object.values(data))
            : [];

        const previousCount = ordersCache.length;

        ordersCache = updatedOrders;

        localStorage.setItem(
            "kc_orders",
            JSON.stringify(ordersCache)
        );

        // Notify farmer about newly received orders
        if (
            S.role === "farmer" &&
            updatedOrders.length > previousCount
        ) {

            const newOrders = updatedOrders.slice(previousCount);

            newOrders.forEach(order => {

                toast(
                    "🔔 NEW ORDER! " +
                    order.n +
                    " · ₹" +
                    order.t
                );

            });
        }

        if (S.role === "farmer") {
            farmer();
        }

    }, error => {

        console.error("Order listener error:", error);

    });
}

// ==========================================
// FIREBASE AUTHENTICATION
// ==========================================

auth.onAuthStateChanged(async user => {

    currentUser = user;
    authReady = true;

    if (!user) {

        firebaseReady = false;

        showAuth();

        setDbStatus("Please sign in");

        return;
    }

    setDbStatus("Signed in · Connecting...");

    await loadFirebaseData();

    render();

});


// ==========================================
// SIGN IN
// ==========================================

async function signIn() {

    try {

        const email = $("auth-email").value.trim();
        const password = $("auth-password").value;

        if (!email || !password) {
            throw new Error("Enter email and password.");
        }

        await auth.signInWithEmailAndPassword(
            email,
            password
        );

    } catch (error) {

        authError(error);

    }
}


// ==========================================
// SIGN UP
// ==========================================

async function signUp() {

    try {

        const email = $("auth-email").value.trim();
        const password = $("auth-password").value;

        if (!email || !password) {
            throw new Error("Enter email and password.");
        }

        if (password.length < 6) {
            throw new Error("Password must contain 6 characters.");
        }

        await auth.createUserWithEmailAndPassword(
            email,
            password
        );

    } catch (error) {

        authError(error);

    }
}


// ==========================================
// SIGN OUT
// ==========================================

async function signOutUser() {

    try {

        // Remove Firebase listeners
        productsRef.off();
        ordersRef.off();

        await auth.signOut();

        S.role = null;
        S.lang = null;

    } catch (error) {

        toast(error.message);

    }
}
const t=k=>T[S.lang][k];
const nm=k=>{const c=CAT.find(x=>x.k===k)||{};return c[S.lang]||k};
const info=k=>CAT.find(x=>x.k===k)||{e:'🧺',c:'veg'};
const unitOf=k=>UNIT[k]||'kg';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const all=()=>SEED.concat(L('kc_products'));
const myName=()=>{try{return localStorage.getItem('kc_me')||''}catch(e){return''}};

function head(){
 let h=`<button class="pill" onclick="setLang('${S.lang==='en'?'kn':'en'}')">${S.lang?t('lang'):''}</button>`;
 if(S.role)h+=` <button class="pill" onclick="S.role=null;render()">${t('back')}</button>`;
 if(currentUser)h+=` <button class="pill" onclick="signOutUser()">Sign out</button>`;
 $('hbtns').innerHTML=S.lang?h:'';
}
function setLang(l){S.lang=l;document.documentElement.lang=l;render()}
function render(){if(!authReady||!currentUser){if(authReady&&!currentUser)showAuth();return;}head();const a=$('app');
 if(!S.lang){a.innerHTML=`<div class="center"><div style="font-size:56px">🌾</div><h1>Kisan Connect<br><span style="font-size:22px">ಕಿಸಾನ್ ಕನೆಕ್ಟ್</span></h1><p class="mute">Choose your language · ನಿಮ್ಮ ಭಾಷೆಯನ್ನು ಆರಿಸಿ</p>
 <div class="opts"><button class="opt" onclick="setLang('en')"><span class="e">🇬🇧</span>English</button><button class="opt" onclick="setLang('kn')"><span class="e">ಕ</span>ಕನ್ನಡ</button></div></div>`;return}
 if(!S.role){a.innerHTML=`<div class="center"><h1>${t('who')}</h1><p class="mute">${t('tag')}</p><div class="opts">
 <button class="opt" onclick="S.role='farmer';render()"><span class="e">👨‍🌾</span><span>${t('farmer')}<small>${t('farmerS')}</small></span></button>
 <button class="opt" onclick="S.role='consumer';render()"><span class="e">🛒</span><span>${t('cons')}<small>${t('consS')}</small></span></button></div></div>`;return}
 S.role==='farmer'?farmer():consumer();
}
/* FARMER */
function farmer(){
 const me=myName(),mine=L('kc_products').filter(p=>p.f===me||!me);
 const ords=L('kc_orders');
 S.seen=ords.length;
 const opts=CAT.map(c=>`<option value="${c.k}">${c.e} ${c[S.lang]}</option>`).join('');
 $('app').innerHTML=`<h2>👨‍🌾 ${t('myP')}</h2>
 <div class="panel"><div class="form">
 <div><label>${t('name')}</label><input id="fn" value="${esc(me)}"></div>
 <div><label>${t('village')}</label><input id="fv" value="${esc(localStorage.getItem('kc_v')||'')}"></div>
 <div><label>${t('dist')}</label><input id="fd" type="number" min="0" value="5"></div>
 <div><label>${t('prod')}</label><select id="fk">${opts}</select></div>
 <div><label>${t('qty')}</label><input id="fq" type="number" min="1"></div>
 <div><label>${t('price')}</label><input id="fp" type="number" min="1"></div>
 <button class="btn" onclick="addProd()">${t('addP')}</button></div></div>
 <div class="panel">${mine.length?mine.map(p=>`<div class="li"><span>${info(p.k).e} <b>${nm(p.k)}</b> — ${p.q} ${unitOf(p.k)} · ₹${p.p}/${unitOf(p.k)}</span><button class="x" onclick="rmProd('${p.id}')">${t('remove')}</button></div>`).join(''):`<p class="mute">${t('noP')}</p>`}</div>
 <h2>🔔 ${t('orders')} <span class="mute" style="font-size:13px;font-weight:400">(${t('ofKm')})</span></h2>
 <div class="panel">${ords.length?ords.slice().reverse().map(o=>`<div class="li" style="align-items:flex-start"><span><b>${t('ordFrom')} ${esc(o.n)}</b><br><span class="mute">${esc(o.a)}</span><br>${o.items.map(i=>`${info(i.k).e} ${nm(i.k)} × ${i.n}`).join(', ')}</span><b>₹${o.t}</b></div>`).join(''):`<p class="mute">${t('noO')}</p>`}</div>
 <p class="note">${t('demo')}</p>`;
}
function addProd(){
 const n=$('fn').value.trim(),q=+$('fq').value,p=+$('fp').value;
 if(!n||q<=0||p<=0){toast(t('needP'));return}
 try{localStorage.setItem('kc_me',n);localStorage.setItem('kc_v',$('fv').value)}catch(e){}
 const a=L('kc_products');a.push({id:'u'+Date.now(),k:$('fk').value,q,p,f:n,v:$('fv').value.trim()||'—',d:+$('fd').value||5});
 W('kc_products',a);render();
}
function rmProd(id){W('kc_products',L('kc_products').filter(p=>p.id!==id));render()}
/* CONSUMER */
function consumer(){
 const cats=['all','veg','fruit','dairy','grain'];
 $('app').innerHTML=`<input class="search" id="sq" placeholder="${t('search')}" value="${esc(S.q)}" oninput="S.q=this.value;grid()">
 <div class="hero"><div><b>${t('hero')}</b>${t('heroS')}</div><span>🥬</span></div>
 <div class="chips">${cats.map(c=>`<button class="chip ${S.cat===c?'on':''}" onclick="S.cat='${c}';render()">${t(c)}</button>`).join('')}</div>
 <div class="grid" id="grid"></div><div id="bar"></div>`;
 grid();
}
function grid(){
 const q=S.q.toLowerCase();
 const list=all().filter(p=>p.q>0&&(S.cat==='all'||info(p.k).c===S.cat)&&(!q||nm(p.k).toLowerCase().includes(q)||p.k.includes(q)));
 $('grid').innerHTML=list.map(p=>{const n=S.cart[p.id]||0;return`<div class="p"><div class="img">${info(p.k).e}</div><span class="tag">${p.d} ${t('km')}</span>
 <div class="n">${nm(p.k)}</div><div class="f">${t('by')} ${esc(p.f)} · ${p.q} ${unitOf(p.k)} ${t('left')}</div>
 <div class="row"><b>₹${p.p}<small class="mute">/${unitOf(p.k)}</small></b>${n?`<div class="step"><button onclick="chg('${p.id}',-1)">−</button><span>${n}</span><button onclick="chg('${p.id}',1)">+</button></div>`:`<button class="add" onclick="chg('${p.id}',1)">${t('add')}</button>`}</div></div>`}).join('');
 bar();
}
function chg(id,d){const p=all().find(x=>x.id===id);const n=Math.max(0,Math.min(p.q,(S.cart[id]||0)+d));n?S.cart[id]=n:delete S.cart[id];
 if($('grid'))grid();if($('modal'))cartView()}
function tot(){let c=0,s=0;all().forEach(p=>{const n=S.cart[p.id]||0;c+=n;s+=n*p.p});return[c,s]}
function bar(){const[c,s]=tot();$('bar').innerHTML=c?`<div class="cartbar"><button onclick="cartView()"><span>${c} ${t('items')} · ₹${s}</span><span>${t('view')} ›</span></button></div>`:''}
function cartView(){
 const[c,s]=tot();const ps=all().filter(p=>S.cart[p.id]);
 $('layer').innerHTML=`<div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="sheet"><h2 style="margin-top:0">${t('cart')}</h2>
 ${ps.length?ps.map(p=>`<div class="li"><span>${info(p.k).e} <b>${nm(p.k)}</b><br><small class="mute">${esc(p.f)} · ₹${p.p}/${unitOf(p.k)}</small></span><span class="step"><button onclick="chg('${p.id}',-1)">−</button><span>${S.cart[p.id]}</span><button onclick="chg('${p.id}',1)">+</button></span><b>₹${p.p*S.cart[p.id]}</b></div>`).join('')+
 `<div class="li"><b>${t('total')}</b><b>₹${s}</b></div>
 <div class="form" style="margin:10px 0"><div><label>${t('yourN')}</label><input id="cn"></div><div><label>${t('addr')}</label><input id="ca"></div></div>
 <button class="btn" style="width:100%;padding:14px" onclick="order()">${t('place')} · ₹${s}</button>`:`<p class="mute">${t('empty')}</p>`}
 <button class="btn o" style="width:100%;margin-top:10px" onclick="closeM()">${t('close')}</button></div></div>`;
}
function closeM(){$('layer').innerHTML='';if($('grid'))grid()}
function order(){
 const n=$('cn').value.trim(),a=$('ca').value.trim();if(!n||!a){toast(t('need'));return}
 const ps=all().filter(p=>S.cart[p.id]);
 const farmers=[...new Set(ps.filter(p=>p.d<=10).map(p=>p.f))];
 const o={id:Date.now(),n,a,t:tot()[1],items:ps.map(p=>({k:p.k,n:S.cart[p.id],f:p.f}))};
 const os=L('kc_orders');os.push(o);W('kc_orders',os);
 const mp=L('kc_products');mp.forEach(p=>{if(S.cart[p.id])p.q-=S.cart[p.id]});W('kc_products',mp);
 S.cart={};
 $('layer').innerHTML=`<div class="modal"><div class="sheet" style="text-align:center"><div style="font-size:60px">✅</div><h1>${t('done')}</h1>
 <p>🔔 ${farmers.length||1} ${t('notified')}:<br><b>${esc(farmers.join(', '))}</b></p><button class="btn" style="width:100%" onclick="closeM()">${t('close')}</button></div></div>`;
 grid();
}
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),4000)}
window.addEventListener('storage',e=>{
 if(e.key==='kc_orders'&&S.role==='farmer'){const o=L('kc_orders').slice(-1)[0];if(o)toast('🔔 '+t('newO')+': '+o.n+' · ₹'+o.t);render()}
 if(e.key==='kc_products'&&S.role==='consumer'&&!$('modal'))grid();
});
setInterval(()=>{if(currentUser)refreshFirebaseData()},5000);
</script>
